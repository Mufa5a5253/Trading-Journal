:root{
  /* LIGHT (default) — warm champagne cream + metallic gold */
  --bg:#f1e6cc;
  --surface:#fffdf8; --surface2:#f7efdd;
  --line:#ece0c2; --line2:#e0d2ac;
  --ink:#2a2316; --mut:#897c5f; --mut2:#b3a682;
  --gold:#9c7616; --gold-ring:#dcc07a; --gold-dim:#e3d09a; --gold-soft:rgba(168,122,30,.10);
  --gold-grad:linear-gradient(135deg,#f0d98f 0%,#cda23c 44%,#a97c20 100%); --gold-ink-grad:linear-gradient(135deg,#c2902a 0%,#a3781a 50%,#866010 100%);
  --up:#0e9d6b; --up-bg:rgba(14,157,107,.10);
  --down:#d6453f; --down-bg:rgba(214,69,63,.09);
  --shadow:0 1px 2px rgba(120,92,30,.05),0 2px 8px rgba(120,92,30,.05);
  --shadow-md:0 8px 26px rgba(120,92,30,.12);
  --shadow-lg:0 28px 70px rgba(80,60,15,.20);
  --scrim:rgba(60,48,20,.34);
  --r:18px;
  color-scheme:light;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
body.dark{
  --bg:#100e08;
  --surface:#1b1710; --surface2:#241f15;
  --line:#2c2517; --line2:#3a3120;
  --ink:#f1ebd8; --mut:#a99c7e; --mut2:#6f6549;
  --gold:#e7c870; --gold-ring:#6e5a2c; --gold-dim:#5f4f28; --gold-soft:rgba(231,200,112,.12);
  --gold-grad:linear-gradient(135deg,#f6e3a4,#dcb24e 45%,#b3852a); --gold-ink-grad:linear-gradient(135deg,#f6e3a4,#dcb24e 45%,#b3852a);
  --up:#2fd39a; --up-bg:rgba(47,211,154,.13);
  --down:#fb6f7e; --down-bg:rgba(251,111,126,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 10px 30px rgba(0,0,0,.45);
  --shadow-lg:0 28px 70px rgba(0,0,0,.6);
  --scrim:rgba(8,6,3,.74);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
    radial-gradient(1200px 820px at 72% -12%, #fbf4e1 0%, rgba(251,244,225,0) 58%),
    radial-gradient(900px 720px at -5% 105%, #f0e3c2 0%, rgba(240,227,194,0) 52%),
    linear-gradient(162deg,#f6edd6,#eee2c3);
  background-attachment:fixed;
  transition:color .25s ease;
}
body.dark{
  background:
    radial-gradient(1100px 760px at 76% -12%, #251c0d 0%, rgba(37,28,13,0) 58%),
    radial-gradient(800px 680px at -5% 105%, #1a1409 0%, rgba(26,20,9,0) 52%),
    linear-gradient(162deg,#15120b,#0d0b06);
  background-attachment:fixed;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Space Grotesk','Inter',sans-serif}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)} .mut{color:var(--mut)}
.gg{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.side{width:218px;flex:0 0 218px;border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;padding:20px 13px;z-index:40;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 86%,transparent),color-mix(in srgb,var(--surface) 70%,transparent));
  backdrop-filter:blur(8px)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:22px 12px 16px}
.brand .mark{flex:0 0 auto;display:grid;place-items:center}
.brand .mark img{width:68px;height:auto;object-fit:contain;display:block}
.brand .wm-text{display:flex;flex-direction:column;align-items:center;min-width:0;margin-top:-11px}
.brand .wm-line{font-family:'Space Grotesk';font-size:21px;font-weight:600;letter-spacing:-.5px;line-height:1.05}
.brand small{display:block;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-top:8px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--mut);
  font-weight:500;font-size:13.5px;transition:.14s;position:relative}
.nav a svg{width:18px;height:18px;flex:0 0 18px;stroke-width:1.7}
.nav a:hover{color:var(--ink);background:var(--surface2)}
.nav a.on{color:var(--ink);background:var(--surface2)}
.nav a.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold-grad)}
.nav a.on svg{color:var(--gold)}
.side-foot{padding:12px 8px 2px;border-top:1px solid var(--line);margin-top:6px}
.theme-tog{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px}
.theme-tog button{flex:1;padding:7px 4px;border-radius:8px;color:var(--mut);font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.13s}
.theme-tog button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.theme-tog button.on svg{color:var(--gold)}
.theme-tog svg{width:14px;height:14px;stroke-width:1.9}
.tb-theme{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--mut)}
.tb-theme svg{width:17px;height:17px;stroke-width:1.9}
.side-foot .acct{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.side-foot .bal{font-family:'Space Grotesk';font-size:20px;font-weight:600;margin-top:2px;letter-spacing:-.3px}

.main{flex:1;margin-left:218px;min-height:100vh;padding:26px 34px 96px}
.topbar{display:none}
.fab{position:fixed;right:28px;bottom:28px;z-index:45;background:var(--gold-grad);
  color:#2a1e08;font-weight:700;font-size:14px;padding:14px 20px;border-radius:30px;
  box-shadow:0 10px 28px rgba(180,130,30,.4),inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;gap:8px}
.fab svg{width:17px;height:17px;stroke-width:2.6}

/* ---------- view header ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.vhead h1{font-family:'Space Grotesk';font-size:27px;font-weight:600;letter-spacing:-.6px}
.vhead .sub{color:var(--mut);font-size:13px;margin-top:3px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--mut);transition:.13s}
.seg button.on{background:var(--surface2);color:var(--ink);box-shadow:var(--shadow)}
.seg button:not(.on):hover{color:var(--ink)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--gold-dim);border-radius:22px;padding:24px 26px;margin-bottom:16px;
  background:
    radial-gradient(700px 300px at 88% 0%, var(--gold-soft), transparent 70%),
    linear-gradient(150deg, var(--surface), var(--surface2));
  box-shadow:var(--shadow-md)}
.hero .eyebrow{font-family:'Space Grotesk';font-size:10.5px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold)}
.hero .big{font-family:'Space Grotesk';font-size:46px;font-weight:600;letter-spacing:-1.6px;line-height:1.04;margin-top:8px;background-image:var(--gold-ink-grad)}
.hero .row{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.hero .hpill{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono';font-size:13px;font-weight:600;
  padding:5px 11px;border-radius:20px}
.hero .hsub{font-size:12px;color:var(--mut)}
.hero .wm{position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:230px;height:230px;
  opacity:.10;pointer-events:none;border-radius:30px;overflow:hidden}
.hero .wm img{width:100%;height:100%;object-fit:contain}
.hero-spark{margin-top:18px}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.kpi .lab{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:'Space Grotesk';font-size:25px;font-weight:600;margin-top:10px;letter-spacing:-.7px}
.kpi .meta{font-size:11.5px;color:var(--mut2);margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}
.panel-h h3{font-family:'Space Grotesk';font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);font-weight:600}
.panel-b{padding:17px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut2);font-weight:700;
  padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.1s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px}
.pill.long{background:var(--up-bg);color:var(--up)}
.pill.short{background:var(--down-bg);color:var(--down)}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:500;
  background:var(--surface2);border:1px solid var(--line2);color:var(--mut);margin:1px}
.tag.bad{color:var(--down);border-color:color-mix(in srgb,var(--down) 35%,transparent)}
.tag.good{color:var(--up);border-color:color-mix(in srgb,var(--up) 35%,transparent)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty .logo{width:124px;margin:0 auto 12px}
.empty .logo img{width:100%;display:block}
.empty .ic{width:50px;height:50px;margin:0 auto 16px;border-radius:15px;background:var(--surface2);
  display:grid;place-items:center;color:var(--gold);border:1px solid var(--gold-dim)}
.empty .ic svg{width:23px;height:23px;stroke-width:1.6}
.empty h4{font-family:'Space Grotesk';color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px}
.empty p{font-size:13px;max-width:350px;margin:0 auto 18px;line-height:1.55}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:11px;font-weight:600;font-size:13px;transition:.14s}
.btn.gold{background:var(--gold-grad);color:#2a1e08;box-shadow:0 4px 14px rgba(180,130,30,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--gold-ring)}
.btn.danger{background:var(--down-bg);color:var(--down);border:1px solid color-mix(in srgb,var(--down) 32%,transparent)}
.btn svg{width:15px;height:15px;stroke-width:2}

/* equity chart */
.chartwrap{position:relative;width:100%}
.eq-tip{position:absolute;pointer-events:none;background:var(--surface2);border:1px solid var(--line2);
  border-radius:7px;padding:6px 9px;font-size:11px;opacity:0;transition:.08s;white-space:nowrap;z-index:5}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-arrow{width:33px;height:33px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:17px;color:var(--mut);display:grid;place-items:center;box-shadow:var(--shadow)}
.cal-arrow:hover{color:var(--ink);border-color:var(--gold-ring)}
.cal-month{font-family:'Space Grotesk';font-weight:600;font-size:15px;min-width:150px;text-align:center;cursor:pointer;
  padding:7px 12px;border-radius:10px;border:1px solid transparent;color:var(--ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.cal-month:hover{background:var(--surface2);border-color:var(--line)}
.cal-caret{font-size:10px;color:var(--gold)}
.mp-year{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.mp-y{font-family:'Space Grotesk';font-size:19px;font-weight:600;min-width:74px;text-align:center}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mp-m{padding:13px 0;border-radius:11px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:13px;color:var(--ink);transition:.12s}
.mp-m:hover{border-color:var(--gold-ring)}
.mp-m.on{background:var(--gold-grad);color:#2a1e08;border-color:transparent;box-shadow:0 4px 12px rgba(180,130,30,.3)}
.cal-today{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--mut);box-shadow:var(--shadow)}
.cal-today:hover{color:var(--gold);border-color:var(--gold-ring)}
.cal-overview{display:flex;flex-wrap:wrap;padding:15px 6px;border-bottom:1px solid var(--line)}
.ov-item{flex:1;min-width:88px;padding:4px 17px;border-right:1px solid var(--line)}
.ov-item:last-child{border-right:none}
.ov-l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut2);font-weight:700}
.ov-v{font-family:'Space Grotesk';font-size:18px;font-weight:600;margin-top:4px;letter-spacing:-.3px}
.ov-empty{padding:10px 17px;color:var(--mut);font-size:13px}
.cal-modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-modehint{font-size:12px;color:var(--mut)}
.cal-modelbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut2);font-weight:700}
.cal{display:grid;gap:6px}
.cal.full{grid-template-columns:repeat(7,1fr) 1.04fr}
.cal.mini{grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:10px;color:var(--mut2);text-transform:uppercase;text-align:center;font-weight:700;padding-bottom:4px;letter-spacing:.6px}
.cal .dow.wk{color:var(--gold)}
.cell{border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;transition:.13s;position:relative;overflow:hidden}
.cal.full .cell{min-height:78px}
.cal.mini .cell{min-height:48px;padding:6px;border-radius:9px}
.cell.empty{border-color:transparent;background:transparent}
.cell[onclick]{cursor:pointer}
.cell[onclick]:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--gold-ring)}
.cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cell-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cell .d{font-size:11.5px;font-weight:700;line-height:1}
.cal.mini .cell .d{font-size:10.5px}
.cell .n{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink);font-weight:700;background:var(--surface);border:1px solid var(--line2);padding:1px 7px;border-radius:9px;line-height:1.5;box-shadow:var(--shadow)}
body.dark .cell .n{background:var(--surface2)}
.cal.mini .cell .n{font-size:8.5px;padding:0 5px}
.cell .p{font-family:'JetBrains Mono';font-size:12.5px;font-weight:700;align-self:flex-start}
.cell .ct{font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;color:var(--ink);opacity:.6;line-height:1;align-self:flex-start}
.cal.mini .cell .p{font-size:10px}
.wcell{border-radius:12px;border:1px dashed var(--gold-dim);background:var(--gold-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:6px}
.wcell.empty{opacity:.5}
.wk-l{font-family:'Space Grotesk';font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.wk-p{font-size:12.5px;font-weight:700}
.wk-n{font-size:9px;color:var(--mut2);font-weight:600}

/* bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row .bl{flex:0 0 96px;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:24px;background:var(--surface2);border-radius:7px;position:relative;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;border-radius:7px}
.bar-row .bv{flex:0 0 80px;text-align:right;font-family:'JetBrains Mono';font-size:12px;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(5px);z-index:60;
  display:none;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:20px;width:100%;max-width:560px;
  box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:'Space Grotesk';font-size:17px;font-weight:600}
.modal-h .x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.modal-h .x:hover{background:var(--surface2);color:var(--ink)}
.modal-b{padding:22px;max-height:74vh;overflow-y:auto}
.modal-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* form */
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;color:var(--ink);transition:.12s}
body:not(.dark) .inp{background:#fffefb}
.inp:focus{outline:none;border-color:var(--gold-ring);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg-in{display:flex;gap:8px}
.seg-in button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);font-weight:600;color:var(--mut);transition:.12s}
.seg-in button.long.on{background:var(--up-bg);color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.seg-in button.short.on{background:var(--down-bg);color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 13px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--line2);background:var(--bg);color:var(--mut);transition:.12s}
.chip.on{background:var(--gold-grad);color:#2a1e08;border-color:transparent;font-weight:600}
.chip.psy.on{background:var(--surface2);color:var(--gold);border-color:var(--gold-ring)}
.chip.psy.neg.on{background:var(--down-bg);color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,transparent)}
.calc-box{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:13px 15px;display:flex;justify-content:space-between;gap:8px;margin-bottom:15px}
body:not(.dark) .calc-box{background:#fffefb}
.calc-box .ci{text-align:center;flex:1}
.calc-box .ci .l{font-size:9.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.calc-box .ci .v{font-family:'JetBrains Mono';font-size:16px;font-weight:600;margin-top:4px}

/* shots */
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shot{position:relative;width:82px;height:82px;border-radius:11px;overflow:hidden;border:1px solid var(--line2)}
.shot img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.shot .rm{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.7);
  color:#fff;display:grid;place-items:center;font-size:13px}
.shotlbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.72);color:#fff;font-size:8px;
  text-align:center;padding:2px 0;font-weight:600;letter-spacing:.2px}
.upload{width:82px;height:82px;border-radius:11px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--mut2);cursor:pointer}
.upload:hover{border-color:var(--gold-ring);color:var(--gold)}
.upload svg{width:20px;height:20px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:90;
  background:var(--surface);border:1px solid var(--line2);border-radius:13px;padding:12px 17px;
  display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-lg);transition:.22s;opacity:0;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.toast button{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}

/* setup cards */
.setup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.15s;cursor:pointer;box-shadow:var(--shadow)}
.setup-card:hover{border-color:var(--gold-ring);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.setup-card .sh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px}
.setup-card h4{font-family:'Space Grotesk';font-size:16px;font-weight:600}
.setup-card .desc{font-size:12.5px;color:var(--mut);margin-bottom:14px;line-height:1.5;min-height:18px}
.setup-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line);padding-top:12px}
.setup-stats .s{text-align:center}
.setup-stats .s .l{font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.setup-stats .s .v{font-family:'JetBrains Mono';font-size:14px;font-weight:600;margin-top:3px}
.grade{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--surface2);color:var(--gold);border:1px solid var(--gold-ring)}

.insight{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:none}
.insight .ib{flex:0 0 32px;height:32px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;border:1px solid var(--gold-dim)}
.insight .ib svg{width:15px;height:15px;color:var(--gold)}
.insight p{font-size:13px;line-height:1.5}
.insight .t{font-weight:600;font-size:13px;margin-bottom:2px}

.notice{background:var(--gold-soft);border:1px solid var(--gold-dim);border-radius:11px;padding:12px 15px;font-size:12.5px;color:var(--gold);margin-bottom:18px}

@media(max-width:860px){
  .side{transform:translateX(-100%)}
  .main{margin-left:0;padding:14px 14px 96px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .topbar .tb-brand{display:flex;align-items:center;gap:10px}
  .topbar .mark{width:40px;height:40px;display:grid;place-items:center}
  .topbar .mark img{width:100%;height:100%;object-fit:contain}
  .topbar b{font-family:'Space Grotesk';font-size:15px;font-weight:600}
  .topbar .bal{font-family:'Space Grotesk';font-size:16px;font-weight:600}
  .topbar .bal small{display:block;font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;text-align:right;font-weight:700}
  .botnav{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px)}
  .botnav a{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--mut2);font-size:9.5px;font-weight:600}
  .botnav a svg{width:21px;height:21px;stroke-width:1.8}
  .botnav a.on{color:var(--gold)}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:22px}
  .fab{right:14px;bottom:78px;padding:13px 17px}
  .vhead h1{font-size:23px}
  .hero .big{font-size:38px}
  .hero .wm{width:160px;height:160px;opacity:.08}
  .row3{grid-template-columns:1fr}
  .modal-b{max-height:68vh}
  th.hide-m,td.hide-m{display:none}
}
@media(min-width:861px){ .botnav{display:none} }
@media(max-width:520px){ .kpis{grid-template-columns:1fr 1fr} .calc-box{flex-wrap:wrap} .calc-box .ci{flex:1 0 30%} .hero .big{font-size:33px} }

/* ===== Drive connect gate + sync status ===== */
#gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 600px at 50% -10%, #fbf4e1, #efe3c5)}
body.dark #gate{background:radial-gradient(900px 600px at 50% -10%, #241d10, #0e0c07)}
#gate.on{display:flex}
.gate-card{max-width:430px;text-align:center;background:var(--surface);border:1px solid var(--gold-dim);border-radius:22px;padding:36px 32px;box-shadow:var(--shadow-lg)}
.gate-logo{width:98px;height:auto;object-fit:contain;margin:0 auto;display:block}
.gate-t{font-family:'Space Grotesk';font-size:22px;font-weight:600;letter-spacing:-.4px;margin-top:-16px;margin-bottom:14px}
.gate-p{font-size:13.5px;color:var(--mut);line-height:1.6;margin-bottom:18px}
.gate-btn{margin:0 auto}
.gate-fine{font-size:11px;color:var(--mut2);margin-top:16px;line-height:1.5}
.sync{font-size:10px;font-weight:700;text-align:center;margin-top:11px;letter-spacing:.4px;color:var(--rail-mut);text-transform:uppercase}
.sync.synced{color:var(--rgain)} .sync.saving{color:var(--rail-gold)} .sync.error{color:var(--rloss)}
:root{ --rail-bg1:#16120b; --rail-bg2:#0b0905; --rail-glow:rgba(236,196,106,.11);
  --rail-ink:#f3edda; --rail-mut:#a2957c; --rail-gold:#edc46a;
  --rail-line:rgba(236,196,106,.14); --rail-soft:rgba(255,255,255,.045);
  --rgain:#37d39a; --rloss:#fb7185; }
body.dark{ --rail-bg1:#241d12; --rail-bg2:#16110a; --rail-glow:rgba(236,196,106,.10);
  --rail-line:rgba(236,196,106,.18); --rail-soft:rgba(255,255,255,.05); }
.side{padding:0;border-right:1px solid var(--rail-line);backdrop-filter:none;
  background:radial-gradient(380px 200px at 50% -8%, var(--rail-glow), transparent 72%), linear-gradient(180deg,var(--rail-bg1),var(--rail-bg2))}
.side::after{content:"";position:absolute;top:0;bottom:0;right:0;width:2px;background:var(--gold-grad);opacity:.5}
.side .brand{padding:20px 14px 16px;align-items:center}
.side .brand .wm-line{color:var(--rail-ink)}
.side .brand small{color:var(--rail-gold)}
.cockpit{margin:0 14px 16px;padding:14px 15px;border-radius:15px;background:var(--rail-soft);border:1px solid var(--rail-line);position:relative;overflow:hidden}
.cockpit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-grad);opacity:.7}
.cap-eyebrow{font-family:'Space Grotesk';font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--rail-mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-eq{font-family:'Space Grotesk';font-size:22px;font-weight:600;letter-spacing:-.6px;margin-top:5px}
.cap-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.cap-pill{font-family:'JetBrains Mono';font-size:11.5px;font-weight:600}
.cap-spark svg{display:block}
.side .nav{padding:0 12px;gap:3px}
.side .nav a{color:var(--rail-mut)}
.side .nav a svg{color:var(--rail-mut)}
.side .nav a:hover{background:var(--rail-soft);color:var(--rail-ink)}
.side .nav a:hover svg{color:var(--rail-ink)}
.side .nav a.on{background:var(--gold-grad);color:#2a1e08;box-shadow:0 5px 16px rgba(180,130,30,.4),inset 0 1px 0 rgba(255,255,255,.55)}
.side .nav a.on svg{color:#2a1e08}
.side .nav a.on::before{display:none}
.side-foot{padding:14px;border-top:1px solid var(--rail-line);margin-top:6px}
.edge{display:flex;gap:6px;margin-bottom:13px}
.edge-item{flex:1;text-align:center;background:var(--rail-soft);border:1px solid var(--rail-line);border-radius:11px;padding:9px 3px}
.edge-item .ev{font-family:'Space Grotesk';font-size:14px;font-weight:600;color:var(--rail-ink);line-height:1}
.edge-item .el{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--rail-mut);font-weight:700;margin-top:3px}
.edge-empty{font-size:11px;color:var(--rail-mut);text-align:center;padding:4px 2px 8px;line-height:1.4}
.side .theme-tog{background:var(--rail-soft);border-color:var(--rail-line)}
.side .theme-tog button{color:var(--rail-mut)}
.side .theme-tog button.on{background:rgba(255,255,255,.09);color:var(--rail-ink);box-shadow:none}
.side .theme-tog button.on svg{color:var(--rail-gold)}
/* ===== AI Analyst ===== */
.an-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.an-grade{font-family:'Space Grotesk';font-size:30px;font-weight:700;letter-spacing:-1px;width:62px;height:62px;flex:0 0 62px;
  display:grid;place-items:center;border-radius:16px;background:var(--gold-grad);color:#2a1e08;box-shadow:0 6px 18px rgba(180,130,30,.3)}
.an-head{font-family:'Space Grotesk';font-size:17px;font-weight:600;line-height:1.3}
.an-focus{background:var(--gold-soft);border:1px solid var(--gold-dim);border-radius:13px;padding:13px 15px;font-size:13.5px;margin-bottom:18px;line-height:1.5}
.an-focus-l{font-family:'Space Grotesk';font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-right:8px}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:4px}
.an-sec{margin-bottom:16px}
.an-h{font-family:'Space Grotesk';font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin-bottom:10px}
.an-h.good{color:var(--up)} .an-h.bad{color:var(--down)} .an-h.act{color:var(--gold)}
.an-item{display:flex;gap:9px;font-size:13px;line-height:1.5;margin-bottom:9px;align-items:flex-start}
.an-dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;margin-top:6px;background:var(--mut2)}
.an-item.good .an-dot{background:var(--up)} .an-item.bad .an-dot{background:var(--down)} .an-item.act .an-dot{background:var(--gold)}
.an-foot{font-size:11px;color:var(--mut2);margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.an-intro{display:flex;gap:14px;align-items:flex-start}
.an-intro>svg{width:30px;height:30px;color:var(--gold);flex:0 0 30px}
.an-intro-t{font-family:'Space Grotesk';font-size:15px;font-weight:600}
.an-loading{display:flex;flex-direction:column;align-items:center;gap:15px;padding:44px 20px;text-align:center}
.an-spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.an-loading p{font-size:13px;color:var(--mut)}
@media(max-width:680px){ .an-grid{grid-template-columns:1fr} }
.jfilter{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.jfilter .inp{width:auto;flex:0 0 auto;min-width:140px;padding:9px 11px}
.jfilter .btn{flex:0 0 auto}
.risk-banner{display:flex;gap:11px;align-items:flex-start;background:var(--down-bg);border:1px solid color-mix(in srgb,var(--down) 35%,transparent);border-radius:14px;padding:13px 16px;margin-bottom:14px;font-size:13px;color:var(--down);font-weight:600;box-shadow:var(--shadow);line-height:1.5}
.risk-banner svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.risk-row{margin-bottom:13px}
.risk-row:last-child{margin-bottom:0}
.risk-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px}
.risk-h span:first-child{color:var(--mut);font-weight:600}
.risk-h .mono{font-size:11.5px;font-weight:600}
.risk-bar{height:7px;border-radius:5px;background:var(--surface2);overflow:hidden}
.risk-fill{height:100%;border-radius:5px;transition:width .3s}
/* session cards */
.sess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sess{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
.sess-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:9px}
.sess-n{font-family:'Space Grotesk';font-weight:600;font-size:14px}
.sess-t{font-family:'JetBrains Mono';font-size:9.5px;color:var(--mut2);font-weight:600;letter-spacing:.3px}
.sess-p{font-family:'Space Grotesk';font-size:21px;font-weight:600;letter-spacing:-.4px}
.sess-sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.sess-bar{height:5px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.sess-fill{height:100%;border-radius:4px;transition:width .3s}
@media(max-width:560px){ .sess-grid{grid-template-columns:1fr} }
/* news */
.news-wrap{padding:0}
.news-wrap iframe{width:100%!important;border:none!important;background:transparent;display:block}
#financialjuice-eco-widget-container,#financialjuice-news-widget-container{width:100%}
.news-intro-t{font-family:'Space Grotesk';font-size:17px;font-weight:600}
.nt-grid{display:grid;grid-template-columns:1fr 1fr}
.nt-col{min-width:0}
.nt-col:first-child{border-right:1px solid var(--line)}
.nt-h{padding:15px 18px;font-family:'Space Grotesk';font-size:11.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line)}
.news-terminal{background:#0d0f13!important;border:1px solid var(--rail-line)!important;overflow:hidden;padding:0;border-radius:18px}
.news-terminal .nt-col:first-child{border-right-color:var(--rail-line)}
.news-terminal .nt-h{color:var(--rail-gold);border-bottom-color:var(--rail-line)}
@media(max-width:900px){ .nt-grid{grid-template-columns:1fr} .nt-col:first-child{border-right:none;border-bottom:1px solid var(--line)} .news-terminal .nt-col:first-child{border-bottom-color:var(--rail-line)} }
.news-src{display:flex;flex-wrap:wrap;gap:8px}
.news-item{display:block;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);transition:.1s}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--surface2);border-radius:9px;padding-left:11px;padding-right:11px}
.news-item-t{font-weight:600;font-size:14px;line-height:1.4}
.news-item-m{font-size:11px;color:var(--mut2);margin-top:5px;font-weight:600}
.news-src-tag{color:var(--gold)}
.news-item-d{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.news-item.important{background:var(--down-bg);border-left:3px solid var(--down);padding-left:12px;border-radius:0 9px 9px 0}
.news-item.important:hover{background:var(--down-bg);padding-left:12px}
.news-alert-tag{display:inline-block;background:var(--down);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:5px;text-transform:uppercase;margin-right:8px;position:relative;top:-1px}
.news-steps{margin:0 0 18px 18px;font-size:13px;line-height:1.95;color:var(--ink);max-width:560px}
.news-steps a{font-weight:600}
</style>
</head>

<div class="app">
  <!-- sidebar -->
  <aside class="side">
    <div class="brand">
      <div class="mark"><img id="brandMark" alt=""></div>
      <div class="wm-text">
        <span class="wm-line">Trading</span>
        <span class="wm-line gg">Execution</span>
        <small>Journal</small>
      </div>
    </div>
    <div class="cockpit" id="cockpit"></div>

      <div class="sync" id="syncDot"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="tb-brand"><div class="mark"><img id="brandMarkTb" alt=""></div><b>Trading Execution</b></div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="tb-theme" id="tbTheme" onclick="toggleTheme()"></button>
        <div class="bal mono" id="tbBal"><small id="tbAcct">Account</small>$0</div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

</button>

function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v!=null?JSON.parse(v):def; }catch(e){ return (k in mem)?mem[k]:def; } }
function lsSet(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ if(/quota/i.test(String(e))){try{toast('Local storage full — connect Drive or export a backup');}catch(_){}}} }

/* ---- Google Drive engine ---- */
function loadGsi(){ return new Promise(res=>{ if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
  s.onload=fin; s.onerror=fin; document.head.appendChild(s); setTimeout(fin, 9000); }); }
function cacheToken(tok, expiresIn){ try{ localStorage.setItem('tj_gtok', JSON.stringify({t:tok, e:Date.now()+((expiresIn||3600)*1000)-120000})); }catch(_){} }
function cachedToken(){ try{ const o=JSON.parse(localStorage.getItem('tj_gtok')); if(o&&o.t&&o.e>Date.now()) return o.t; }catch(e){} return ''; }
function gHint(){ try{ return localStorage.getItem('tj_gmail')||undefined; }catch(e){ return undefined; } }
async function fetchEmail(){ try{ const r=await dFetch('https://www.googleapis.com/drive/v3/about?fields=user'); const j=await r.json(); if(j.user&&j.user.emailAddress) localStorage.setItem('tj_gmail', j.user.emailAddress); }catch(e){} }
function initTokenClient(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.appdata',
    hint: gHint(),
    callback: (resp)=>{ gToken = (resp&&resp.access_token)?resp.access_token:''; if(gToken && resp.expires_in) cacheToken(gToken, resp.expires_in); if(_tokenResolve){ _tokenResolve(!!gToken); _tokenResolve=null; } },
    error_callback: (err)=>{ if(_tokenResolve){ _tokenResolve(false); _tokenResolve=null; } }
  });
}
function getToken(interactive){ return new Promise(res=>{
  let done=false;
  _tokenResolve=(v)=>{ if(done) return; done=true; res(v); };
  setTimeout(()=>{ if(!done && _tokenResolve){ _tokenResolve(false); _tokenResolve=null; } }, interactive?90000:6000);
  try{ tokenClient.requestAccessToken({prompt: interactive?'consent':''}); }
  catch(e){ if(!done && _tokenResolve){ _tokenResolve(false); _tokenResolve=null; } }
}); }
async function dFetch(url,opts){
  opts=opts||{}; opts.headers=Object.assign({Authorization:'Bearer '+gToken}, opts.headers||{});
  let r=await fetch(url,opts);
  if(r.status===401){ const ok=await getToken(false); if(ok){ opts.headers.Authorization='Bearer '+gToken; r=await fetch(url,opts); } }
  return r;
}
async function loadDoc(){
  const q=encodeURIComponent("name='journal.json'");
  const r=await dFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=5');
  if(!r.ok){ lastDriveErr='list '+r.status+' '+(await r.text()).slice(0,140); throw new Error(lastDriveErr); }
  const j=await r.json();
  if(j.files && j.files.length){
    docFileId=j.files[0].id;
    const c=await dFetch('https://www.googleapis.com/drive/v3/files/'+docFileId+'?alt=media');
    if(!c.ok){ lastDriveErr='read '+c.status; throw new Error(lastDriveErr); }
    try{ DOC=await c.json(); }catch(e){ DOC={}; }
  } else { DOC={}; docFileId=''; }
  if(!DOC || typeof DOC!=='object') DOC={};
  if(!DOC.shotMap) DOC.shotMap={};
  if(!docFileId) await saveDoc(true);
}
async function saveDoc(force){
  if(!driveConnected && !force) return;
  setSync('saving');
  const body=JSON.stringify(DOC);
  try{
    if(!docFileId){
      const mr=await dFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'journal.json',parents:['appDataFolder']})});
      if(!mr.ok){ throw new Error('create '+mr.status+' '+(await mr.text()).slice(0,140)); }
      docFileId=(await mr.json()).id;
    }
    const pr=await dFetch('https://www.googleapis.com/upload/drive/v3/files/'+docFileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    if(!pr.ok){ throw new Error('write '+pr.status+' '+(await pr.text()).slice(0,140)); }
    setSync('synced');
  }catch(e){ lastDriveErr=String(e.message||e); setSync('error'); }
}
async function uploadShot(dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const mr=await dFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'shot_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.jpg',parents:['appDataFolder']})});
  if(!mr.ok){ lastDriveErr='shot create '+mr.status+' '+(await mr.text()).slice(0,140); throw new Error(lastDriveErr); }
  const fid=(await mr.json()).id; if(!fid) throw new Error('drive create returned no id');
  const pr=await dFetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':blob.type||'image/jpeg'},body:blob});
  if(!pr.ok){ lastDriveErr='shot write '+pr.status; throw new Error(lastDriveErr); }
  return fid;
}
async function driveSelfTest(){
  const log=['token: '+(gToken?('present '+gToken.slice(0,10)+'…'):'MISSING — not signed in')];
  let testId='';
  const step=async(name,fn)=>{ try{ const v=await fn(); log.push('OK  '+name+(v?'  ('+v+')':'')); }catch(e){ log.push('ERR '+name+'  '+(e.message||e)); } };
  await step('create file', async()=>{ const r=await dFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'_tj_test.json',parents:['appDataFolder']})}); if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,160)); testId=(await r.json()).id; return testId.slice(0,10)+'…'; });
  await step('write bytes', async()=>{ if(!testId) throw new Error('no file id'); const r=await dFetch('https://www.googleapis.com/upload/drive/v3/files/'+testId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{"hello":1}'}); if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,160)); return 'written'; });
  await step('read back', async()=>{ if(!testId) throw new Error('no file id'); const r=await dFetch('https://www.googleapis.com/drive/v3/files/'+testId+'?alt=media'); if(!r.ok) throw new Error(r.status); return (await r.text()).slice(0,40); });
  await step('list appData', async()=>{ const r=await dFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&pageSize=20'); if(!r.ok) throw new Error(r.status); const j=await r.json(); return ((j.files||[]).map(f=>f.name).join(', ')||'empty'); });
  await step('delete test', async()=>{ if(!testId) throw new Error('no file id'); const r=await dFetch('https://www.googleapis.com/drive/v3/files/'+testId,{method:'DELETE'}); return 'status '+r.status; });
  if(lastDriveErr) log.push('last error: '+lastDriveErr);
  openModal('Drive diagnostics', `<pre style="white-space:pre-wrap;font-size:11.5px;line-height:1.7;font-family:'JetBrains Mono';color:var(--ink)">${esc(log.join('\n'))}</pre>`, [`<button class="btn gold" onclick="closeModal('scrim')">Done</button>`], 'wide');

async function sGet(k,def){
  if(k==='tj_theme'){ return lsGet('tj_theme',def); }   // theme stays local for instant pre-auth styling
  if(!(DRIVE_ON && driveConnected)) return lsGet(k,def);
  if(k.indexOf('tj_shots_')===0){
    const id=k.slice(9); const refs=(DOC.shotMap&&DOC.shotMap[id])||[]; const out=[];
    for(const ref of refs){ try{ out.push({data:await downloadShot(ref.fid), label:ref.label||'', fid:ref.fid}); }catch(e){} }
    return out;
  }
  const f=DOCKEYS[k]; const val = f?DOC[f]:DOC[k];
  return (val===undefined||val===null)?def:val;
}
async function sSet(k,v){
  if(k==='tj_theme'){ lsSet('tj_theme',v); return true; }
  if(!(DRIVE_ON && driveConnected)){ lsSet(k,v); return true; }
  if(k.indexOf('tj_shots_')===0){
    const id=k.slice(9); DOC.shotMap=DOC.shotMap||{};
    const oldRefs=DOC.shotMap[id]||[]; const newRefs=[];
    for(const s of (v||[])){
      if(s && typeof s==='object' && s.fid){ newRefs.push({fid:s.fid,label:s.label||''}); }
      else { const data=typeof s==='string'?s:(s&&s.data); const label=typeof s==='string'?'':((s&&s.label)||'');
        if(data && /^data:/.test(data)){ try{ const fid=await uploadShot(data); newRefs.push({fid,label}); }catch(e){} } }
    }
    const keep=new Set(newRefs.map(r=>r.fid));
    oldRefs.forEach(o=>{ if(!keep.has(o.fid)) deleteShotFile(o.fid); });
    DOC.shotMap[id]=newRefs; await saveDoc(); return true;
  }
  const f=DOCKEYS[k]; if(f) DOC[f]=v; else DOC[k]=v; await saveDoc(); return true;
}
async function sDel(k){
  if(k==='tj_theme'){ lsDel(k); return; }

/* compute trade derived numbers */
function calc(t){
  const mult=S.contract||100, dir=t.direction==='long'?1:-1, sz=+t.size||0;
  let pnl = t.pnlManual!=null && t.pnlManual!=='' ? +t.pnlManual
          : ((+t.exit||0)-(+t.entry||0))*mult*sz*dir - (+t.fees||0);
  let risk = (t.sl!=null&&t.sl!=='') ? Math.abs((+t.entry||0)-(+t.sl))*mult*sz : 0;
  let r = risk>0 ? pnl/risk : null;
  return {pnl, risk, r};
}

/* aggregate over a trade list */
function agg(list){
  let pnl=0,gp=0,gl=0,w=0,l=0,be=0,rs=[],risk=0;
  list.forEach(t=>{ const v=+t.pnl||0; pnl+=v; if(v>0){gp+=v;w++} else if(v<0){gl+=Math.abs(v);l++} else be++;
    if(t.r!=null) rs.push(t.r); });
  const n=list.length;
  return {
    n,pnl,win:w,loss:l,be,
    winRate: (w+l)?w/(w+l)*100:0,
    pf: gl>0?gp/gl:(gp>0?Infinity:0),
    expectancy: n?pnl/n:0,
    avgR: rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
    avgWin: w?gp/w:0, avgLoss: l?gl/l:0
  };
}
function inRange(list){
  if(RANGE==='all') return list;
  const now=new Date(); let from;
  if(RANGE==='month') from=new Date(now.getFullYear(),now.getMonth(),1);
  else if(RANGE==='week'){ const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); from=d; }
  else if(RANGE==='day'){ from=new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
  return list.filter(t=> new Date(t.date+'T00:00:00')>=from );
}
function sorted(){ return [...TRADES].sort((a,b)=> (a.date+a.entryTime).localeCompare(b.date+b.entryTime) ); }

/* daily pnl map */
function dailyMap(list){ const m={}; list.forEach(t=>{ m[t.date]=(m[t.date]||0)+(+t.pnl||0); }); return m; }

/* discipline score for a day */
function disciplineDay(date){
  const day=TRADES.filter(t=>t.date===date); if(!day.length) return null;
  let score=100;
  day.forEach(t=>{ (t.psych||[]).forEach(p=>{
    if(p==='Revenge trade'||p==='Tilt') score-=25;
    else if(p==='FOMO'||p==='Impulsive entry'||p==='Moved stop') score-=15;
    else if(p==='No plan') score-=10;
  }); if(!(t.notesPre||'').trim()) score-=4; });
  if(day.length>5) score-=Math.min(20,(day.length-5)*5);
  return Math.max(0,Math.min(100,Math.round(score)));
}

/* equity SVG */
function drawEquity(wrap){
  const sd=sorted(); if(!sd.length){ wrap.innerHTML='<div class="empty" style="padding:30px"><p>No data</p></div>'; return; }
  let cum=(S.startBal||0); const pts=[{x:0,y:cum,lbl:'start'}];
  sd.forEach((t,i)=>{ cum+=(+t.pnl||0); pts.push({x:i+1,y:cum,lbl:t.date}); });
  const W=640,H=220,P=8;
  const ys=pts.map(p=>p.y), mn=Math.min(...ys), mx=Math.max(...ys), rng=(mx-mn)||1;
  const X=i=>P+(i/(pts.length-1))*(W-2*P);
  const Y=v=>P+(1-(v-mn)/rng)*(H-2*P);
  let d='', area='';
  pts.forEach((p,i)=>{ const x=X(i),y=Y(p.y); d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; });
  area=d+`L${X(pts.length-1).toFixed(1)} ${H-P} L${X(0).toFixed(1)} ${H-P} Z`;
  const last=pts[pts.length-1].y, up=last>=(S.startBal||0);
  const col=up?getCSS('--up'):getCSS('--down');
  const baseY=Y(S.startBal||0);
  wrap.innerHTML=`<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity="0.22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" y1="${baseY}" x2="${W-P}" y2="${baseY}" stroke="${getCSS('--line2')}" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${area}" fill="url(#eqg)"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
  </svg></div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--mut2)" class="mono">
    <span>${fmt$(S.startBal||0)}</span><span class="${up?'up':'down'}">${dollars(last-(S.startBal||0))} net</span></div>`;
}

function clearJF(){ JF={q:'',dir:'',out:'',sess:'',setup:'',psy:''}; go('journal'); }
function applyJournalFilter(){
  let list=sorted().reverse(); const f=JF;
  if(f.dir) list=list.filter(t=>t.direction===f.dir);
  if(f.out==='win') list=list.filter(t=>+t.pnl>0);
  else if(f.out==='loss') list=list.filter(t=>+t.pnl<0);
  else if(f.out==='be') list=list.filter(t=>(+t.pnl||0)===0);
  if(f.sess) list=list.filter(t=>session(t.entryTime)===f.sess);
  if(f.setup) list=list.filter(t=>t.setupId===f.setup);
  if(f.psy) list=list.filter(t=>(t.psych||[]).includes(f.psy));
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(t=> (t.notesPre||'').toLowerCase().includes(q)||(t.notesPost||'').toLowerCase().includes(q)||setupName(t.setupId).toLowerCase().includes(q)||(t.strats||[]).join(' ').toLowerCase().includes(q)||(t.psych||[]).join(' ').toLowerCase().includes(q)); }
  const body=document.getElementById('jbody'); if(body) body.innerHTML = list.length? list.map(rowJ).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--mut);padding:34px">No trades match these filters</td></tr>`;
  const c=document.getElementById('jcount'); if(c){ const pnl=list.reduce((s,t)=>s+(+t.pnl||0),0); c.innerHTML=`${list.length} trade${list.length===1?'':'s'} · <span class="${cls(pnl)}" style="font-family:'JetBrains Mono'">${dollars(pnl)}</span>`; }
}

function setDir(d){ window._dir=d; document.getElementById('dirL').classList.toggle('on',d==='long'); document.getElementById('dirS').classList.toggle('on',d==='short'); recalc(); }
function recalc(){
  const t={direction:window._dir||'long',entry:val('f_entry'),exit:val('f_exit'),size:val('f_size'),sl:val('f_sl'),fees:val('f_fees'),pnlManual:val('f_pnl')};
  const c=calc(t);
  const tp=val('f_tp'), entry=+t.entry, sl=+t.sl;
  let plannedRR=null;
  if(tp!==''&&t.sl!==''&&entry){ const rwd=Math.abs(tp-entry), rsk=Math.abs(entry-sl); if(rsk>0) plannedRR=rwd/rsk; }
  document.getElementById('calcBox').innerHTML=`
    <div class="ci"><div class="l">P&L</div><div class="v mono ${cls(c.pnl)}">${dollars(c.pnl)}</div></div>
    <div class="ci"><div class="l">Risk $</div><div class="v mono">${c.risk?fmt$(c.risk):'—'}</div></div>
    <div class="ci"><div class="l">Realized R</div><div class="v mono ${c.r!=null?cls(c.r):''}">${c.r!=null?(c.r>0?'+':'')+c.r.toFixed(2)+'R':'—'}</div></div>
    <div class="ci"><div class="l">Planned R:R</div><div class="v mono">${plannedRR!=null?'1:'+plannedRR.toFixed(2):'—'}</div></div>`;
}
function val(id){ const e=document.getElementById(id); return e?e.value:''; }

async function addShots(files){
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{ const b=await compress(f); formShots.push(b); }catch(e){ toast('Could not read image'); }
  }
  renderShots();
}
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=1280; let{width:w,height:h}=img;
        if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',0.72)); };
      img.onerror=()=>rej(); img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
function shotData(s){ return typeof s==='string'?s:((s&&s.data)||''); }
function shotLabel(s){ return typeof s==='string'?'':((s&&s.label)||''); }
function compressFromDataUrl(dataUrl){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ const max=1280; let w=img.width,h=img.height;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.72)); };
    img.onerror=()=>rej(); img.src=dataUrl;
  });
}
function renderShots(){
  const z=document.getElementById('shotZone'); if(!z) return;
  z.innerHTML = formShots.map((s,i)=>`<div class="shot"><img src="${shotData(s)}" onclick="lightbox(${i})">${shotLabel(s)?`<div class="shotlbl">${esc(shotLabel(s))}</div>`:''}<div class="rm" onclick="formShots.splice(${i},1);renderShots()">×</div></div>`).join('')

}

async function saveTrade(){
  const entry=val('f_entry');
  if(entry===''){ toast('Entry price is required'); return; }
  const strats=[...document.querySelectorAll('#stratChips .chip.on')].map(b=>b.dataset.strat);
  const psych=[...document.querySelectorAll('#psychChips .chip.on')].map(b=>b.dataset.psy);
  const t={
    id: editingId||uid(),
    date: val('f_date')||new Date().toISOString().slice(0,10),
    entryTime: val('f_etime'), exitTime: val('f_xtime'),
    direction: window._dir||'long',
    entry, exit: val('f_exit'), size: val('f_size'),
    sl: val('f_sl'), tp: val('f_tp'), fees: val('f_fees'),
    pnlManual: val('f_pnl'),
    setupId: val('f_setup'),
    strats, psych,
    notesPre: val('f_pre'), notesPost: val('f_post'),
    hasShots: formShots.length>0
  };
  const c=calc(t); t.pnl=c.pnl; t.r=c.r; t.risk=c.risk;
  if(editingId){ const i=TRADES.findIndex(x=>x.id===editingId); TRADES[i]=t; }
  else TRADES.push(t);
  await sSet('tj_trades',TRADES);
  if(formShots.length) await sSet('tj_shots_'+t.id, formShots); else await sDel('tj_shots_'+t.id);
  closeModal('scrim'); refreshBal(); go(VIEW);
  const _w=riskWarnings();
  toast(_w.length ? '⚠ '+_w[0] : (editingId?'Trade updated':'Trade logged'));
}

/* delete with undo */
let lastDeleted=null, lastShots=null;
async function delTrade(id){
  const i=TRADES.findIndex(t=>t.id===id); if(i<0) return;
  lastDeleted=TRADES[i]; lastShots=await sGet('tj_shots_'+id,null);
  TRADES.splice(i,1); await sSet('tj_trades',TRADES); await sDel('tj_shots_'+id);
  refreshBal(); go(VIEW); closeModal('detailScrim');
  toast('Trade deleted', 'Undo', undoDelete);
}
async function undoDelete(){
  if(!lastDeleted) return;
  TRADES.push(lastDeleted); await sSet('tj_trades',TRADES);
  if(lastShots) await sSet('tj_shots_'+lastDeleted.id,lastShots);
  lastDeleted=null; lastShots=null; refreshBal(); go(VIEW);
}

function calKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function drawCalendar(wrap,y,m,mini){
  const mode = mini ? 'pnl' : CALMODE;
  const dm=dailyMap(TRADES); const cnt={}; TRADES.forEach(t=>cnt[t.date]=(cnt[t.date]||0)+1);
  const dayR={}; TRADES.forEach(t=>{ if(t.r!=null) dayR[t.date]=(dayR[t.date]||0)+t.r; });
  const first=new Date(y,m,1), startDow=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const today=new Date().toISOString().slice(0,10);
  const rgb=themeRGB();
  let maxMetric=1;
  for(let d=1;d<=days;d++){ const ds=calKey(y,m,d); if(!cnt[ds]) continue;
    let mag=0;
    if(mode==='pnl') mag=Math.abs(dm[ds]||0);
    else if(mode==='r') mag=Math.abs(dayR[ds]||0);
    else { const s=disciplineDay(ds); mag=s==null?0:Math.abs(s-55); }
    if(mag>maxMetric) maxMetric=mag;
  }
  const metric=ds=>{
    if(!cnt[ds]) return null;
    if(mode==='pnl'){ const v=dm[ds]||0; return {tone:v>0?'up':v<0?'down':'neu', mag:Math.abs(v)/maxMetric, disp:dollars(v)}; }
    if(mode==='r'){ const rv=dayR[ds]; if(rv==null) return {tone:'neu',mag:0,disp:'—'};
      return {tone:rv>0?'up':rv<0?'down':'neu', mag:Math.abs(rv)/maxMetric, disp:(rv>0?'+':'')+rv.toFixed(1)+'R'}; }
    const s=disciplineDay(ds); return {tone:s>=65?'up':s<=45?'down':'neu', mag:Math.min(1,Math.abs(s-55)/45), disp:String(s)};
  };
  let html=`<div class="cal ${mini?'mini':'full'}">`;
  ['M','T','W','T','F','S','S'].forEach(d=>html+=`<div class="dow">${d}</div>`);
  if(!mini) html+=`<div class="dow wk">Week</div>`;
  let dn=1-startDow; const rows=Math.ceil((startDow+days)/7); let wk=1;
  for(let r=0;r<rows;r++){
    let wPnl=0,wN=0,wRsum=0,wRhas=false,wDiscSum=0,wDiscDays=0;
    for(let c=0;c<7;c++,dn++){
      if(dn<1||dn>days){ html+=`<div class="cell empty"></div>`; continue; }
      const ds=calKey(y,m,dn), nT=cnt[ds]||0;
      if(nT){ wN+=nT; wPnl+=(dm[ds]||0); if(dayR[ds]!=null){wRsum+=dayR[ds];wRhas=true;} const s=disciplineDay(ds); if(s!=null){wDiscSum+=s;wDiscDays++;} }
      const mt=metric(ds);
      let bg='var(--surface2)',dcol='var(--mut)',pcol='var(--mut2)';
      if(mt){ const it=Math.min(.34,.08+mt.mag*.26);
        if(mt.tone==='up'){bg=`rgba(${rgb.up},${it})`;dcol='var(--ink)';pcol='var(--up)';}
        else if(mt.tone==='down'){bg=`rgba(${rgb.down},${it})`;dcol='var(--ink)';pcol='var(--down)';}
        else {dcol='var(--ink)';pcol='var(--mut)';} }
      const cntTxt=nT?(nT+' '+(nT===1?'trade':'trades')):'';
      const topR=(mini&&nT)?`<span class="n">${nT}</span>`:'';
      const botC=(!mini&&nT)?`<span class="ct">${cntTxt}</span>`:'';
      html+=`<div class="cell${ds===today?' today':''}" style="background:${bg}" ${nT?`onclick="dayDetail('${ds}')"`:''}>
        <div class="cell-top"><span class="d" style="color:${dcol}">${dn}</span>${topR}</div>
        ${mt?`<span class="p mono" style="color:${pcol}">${mt.disp}</span>`:''}
        ${botC}</div>`;
    }
    if(!mini){
      let wDisp='',wTone='neu';
      if(wN){
        if(mode==='pnl'){ wDisp=dollars(wPnl); wTone=wPnl>0?'up':wPnl<0?'down':'neu'; }
        else if(mode==='r'){ wDisp=wRhas?((wRsum>0?'+':'')+wRsum.toFixed(1)+'R'):'—'; wTone=wRsum>0?'up':wRsum<0?'down':'neu'; }
        else { const avg=wDiscDays?Math.round(wDiscSum/wDiscDays):null; wDisp=avg==null?'—':String(avg); wTone=avg>=65?'up':avg<=45?'down':'neu'; }
      }
      html+= wN
        ? `<div class="wcell"><div class="wk-l">W${wk}</div><div class="wk-p mono" style="color:${wTone==='up'?'var(--up)':wTone==='down'?'var(--down)':'var(--mut)'}">${wDisp}</div><div class="wk-n">${wN}t</div></div>`
        : `<div class="wcell empty"><div class="wk-l">W${wk}</div></div>`;
    }
    wk++;
  }
  html+='</div>';
  wrap.innerHTML=html;
}

function bdPanel(title,key){ return `<div class="panel"><div class="panel-h"><h3>${title}</h3></div><div class="panel-b" id="bd_${key}"></div></div>`; }
function sessionStats(list){
  const order=['Asia','London','New York'];
  const map={}; order.forEach(s=>map[s]={k:s,pnl:0,n:0,w:0,l:0,wr:0});
  list.forEach(t=>{ const s=session(t.entryTime); if(!map[s]) return;
    const v=+t.pnl||0; map[s].pnl+=v; map[s].n++; if(v>0)map[s].w++; else if(v<0)map[s].l++; });
  return order.map(s=>{ const m=map[s]; m.wr=(m.w+m.l)?m.w/(m.w+m.l)*100:0; return m; });
}
function groupBy(list,fn){  const m={}; list.forEach(t=>{ const k=fn(t)||'—'; (m[k]=m[k]||[]).push(t); });
  return Object.entries(m).map(([k,v])=>{ const a=agg(v); return {k,pnl:a.pnl,n:a.n,wr:a.winRate}; }).sort((a,b)=>b.pnl-a.pnl);
}
function drawBreakdown(key,rows){
  const wrap=document.getElementById('bd_'+key); if(!wrap) return;
  if(!rows.length){ wrap.innerHTML='<div class="mut" style="text-align:center;padding:16px">No data</div>'; return; }
  const max=Math.max(...rows.map(r=>Math.abs(r.pnl)),1);
  wrap.innerHTML=rows.map(r=>{
    const w=Math.abs(r.pnl)/max*100, pos=r.pnl>=0;
    return `<div class="bar-row"><div class="bl" title="${esc(r.k)}">${esc(r.k)}</div>
      <div class="bar-track"><div class="bar-fill" style="left:50%;width:${(w/2).toFixed(1)}%;${pos?'':'transform:translateX(-100%);'}background:${pos?'var(--up)':'var(--down)'}"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--line2)"></div></div>
      <div class="bv mono ${cls(r.pnl)}">${dollars(r.pnl)}<div class="mut" style="font-size:9px;font-weight:400">${r.n}t · ${r.wr.toFixed(0)}%</div></div></div>`;
  }).join('');
}
function streaks(){
  const sd=sorted(); let cur=0,maxW=0,maxL=0;
  sd.forEach(t=>{ const v=+t.pnl;
    if(v>0){ cur=cur>0?cur+1:1; maxW=Math.max(maxW,cur); }
    else if(v<0){ cur=cur<0?cur-1:-1; maxL=Math.max(maxL,-cur); } });
  // drawdown
  let eq=(S.startBal||0),peak=eq,maxDD=0;
  sd.forEach(t=>{ eq+=(+t.pnl||0); peak=Math.max(peak,eq); maxDD=Math.max(maxDD,peak-eq); });
  return {maxWin:maxW,maxLoss:maxL,cur,maxDD};
}
function renderInsights(wrap,list){
  const ins=[];
  // best session
  const sess=groupBy(list,t=>session(t.entryTime)).filter(r=>r.k!=='Unknown');
  if(sess.length>=2 && sess[0].pnl>0){ const tot=sess.reduce((s,r)=>s+Math.max(0,r.pnl),0);
    if(tot>0) ins.push(['Your strongest session is '+sess[0].k,`It accounts for ${Math.round(Math.max(0,sess[0].pnl)/tot*100)}% of your gross profit. Consider concentrating size here.`]); }
  // worst setup
  const setups=groupBy(list,t=>setupName(t.setupId)).filter(r=>r.k!=='—'&&r.n>=2);
  const bad=setups.filter(r=>r.pnl<0).sort((a,b)=>a.pnl-b.pnl)[0];
  if(bad) ins.push(['“'+bad.k+'” has negative expectancy',`${bad.n} trades, ${dollars(bad.pnl)} net. Review whether this setup belongs in your playbook or needs tighter rules.`]);
  const good=setups[0];
  if(good && good.pnl>0 && setups.length>=2) ins.push(['“'+good.k+'” is your best setup',`${good.n} trades at ${good.wr.toFixed(0)}% win rate, ${dollars(good.pnl)} net.`]);
  // revenge / tilt
  const revenge=list.filter(t=>(t.psych||[]).some(p=>['Revenge trade','Tilt','FOMO'].includes(p)));
  if(revenge.length){ const rp=agg(revenge).pnl;
    ins.push(['Emotional trades are costing you',`${revenge.length} trade${revenge.length>1?'s':''} tagged revenge/tilt/FOMO totalling ${dollars(rp)}. ${rp<0?'These are draining the account.':''}`]); }
  // weekday
  const wd=groupBy(list,t=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][weekday(t.date)]).filter(r=>r.n>=2);
  const worstWd=wd.filter(r=>r.pnl<0).sort((a,b)=>a.pnl-b.pnl)[0];
  if(worstWd) ins.push([worstWd.k+' is your weakest day',`${dollars(worstWd.pnl)} across ${worstWd.n} trades. Worth asking what's different about ${worstWd.k}s.`]);

  if(!ins.length){ wrap.innerHTML='<div class="mut" style="font-size:13px">Log more trades (and tag your setups + psychology) to surface patterns. Insights appear automatically once there\'s enough to compare.</div>'; return; }
  wrap.innerHTML=ins.slice(0,5).map(i=>`<div class="insight"><div class="ib">${sI(I.bolt)}</div><div><div class="t">${esc(i[0])}</div><p class="mut">${esc(i[1])}</p></div></div>`).join('');
}

function readMT5File(f){

    document.getElementById('mt5status').textContent='File loaded — click Import trades.'; };

async function importMT5Trades(arr){
  let added=0,updated=0; const tickets=[];
  for(const m of arr){
    const ticket=String(m.ticket||m.posId||m.id||'');
    let t = ticket ? TRADES.find(x=>x.mt5Ticket===ticket) : null;
    const dir = (m.direction==='short'||m.direction==='sell'||m.type===1) ? 'short' : 'long';
    const isOpen = m.closed===false || m.open===true;
    let shots=[];
    if(Array.isArray(m.shots)){
      for(const s of m.shots){
        const url=typeof s==='string'?s:(s&&s.data); const label=typeof s==='string'?'':((s&&s.label)||'');
        if(!url) continue;
        try{ shots.push({data:await compressFromDataUrl(url),label}); }
        catch(e){ shots.push({data:url,label}); }
      }
    }
    const base={
      mt5Ticket:ticket, source:'mt5', open:isOpen,
      date: m.date || (t&&t.date) || new Date().toISOString().slice(0,10),
      entryTime: m.entryTime!=null?m.entryTime:(t?t.entryTime:''),
      exitTime: m.exitTime!=null?m.exitTime:(t?t.exitTime:''),
      direction: dir,
      entry: m.entry!=null?m.entry:(t?t.entry:''),
      exit: (m.exit!=null&&m.exit!=='')?m.exit:'',
      size: m.volume!=null?m.volume:(m.size!=null?m.size:(t?t.size:'')),
      sl: m.sl!=null?m.sl:(t?t.sl:''),
      tp: m.tp!=null?m.tp:(t?t.tp:''),
      fees: (t?t.fees:'')||''
    };
    if(m.profit!=null && !isOpen) base.pnlManual=m.profit;
    if(t){
      Object.assign(t,base);
      const c=calc(t); t.pnl=isOpen?0:c.pnl; t.r=c.r; t.risk=c.risk;
      if(shots.length){ await sSet('tj_shots_'+t.id,shots); t.hasShots=true; }
      updated++;
    } else {
      const nt=Object.assign({id:uid(),setupId:'',strats:[],psych:[],notesPre:'',notesPost:'',hasShots:shots.length>0},base);
      const c=calc(nt); nt.pnl=isOpen?0:c.pnl; nt.r=c.r; nt.risk=c.risk;
      TRADES.push(nt);
      if(shots.length) await sSet('tj_shots_'+nt.id,shots);
      added++;
    }
    if(ticket) tickets.push(ticket);
  }
  await sSet('tj_trades',TRADES);
  return {added,updated,tickets};
}
async function doImport(){
  const raw=val('mt5paste').trim();
  if(!raw){ toast('Choose a file or paste the JSON first'); return; }

  if(!arr.length){ toast('No trades found in that file'); return; }
  const st=document.getElementById('mt5status'); if(st) st.textContent='Importing…';
  const r=await importMT5Trades(arr);

  toast(`MT5 sync — ${r.added} new, ${r.updated} updated`);
}
/* ---- relay auto-pull (hands-off MT5) ---- */
function jsonp(url){ return new Promise((res,rej)=>{
  const cb='__mt5cb_'+Date.now()+Math.floor(Math.random()*1e4);
  const s=document.createElement('script');
  const to=setTimeout(()=>{ cleanup(); rej(new Error('timeout')); }, 15000);
  function cleanup(){ clearTimeout(to); try{ delete window[cb]; }catch(e){} s.remove(); }
  window[cb]=(d)=>{ cleanup(); res(d); };
  s.onerror=()=>{ cleanup(); rej(new Error('network')); };
  s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
  document.head.appendChild(s);
}); }
let _mt5Poll=null;
async function pullMT5(silent){
  if(!MT5_RELAY_URL) { if(!silent) toast('Set up MT5 auto-sync in Settings first'); return; }
  try{
    const r=await jsonp(MT5_RELAY_URL+'?token='+encodeURIComponent(MT5_RELAY_TOKEN));
    if(!r||!r.ok){ if(!silent) toast('Relay error: '+((r&&r.error)||'check URL/token')); return; }
    if(!Array.isArray(r.trades)||!r.trades.length){ if(!silent) toast('No new MT5 trades'); return; }
    const res=await importMT5Trades(r.trades);
    for(const tk of res.tickets){ try{ await jsonp(MT5_RELAY_URL+'?token='+encodeURIComponent(MT5_RELAY_TOKEN)+'&del='+encodeURIComponent(tk)); }catch(e){} }
    refreshBal(); if(VIEW) go(VIEW);
    if(!silent) toast(`MT5 — ${res.added} new, ${res.updated} updated`);
  }catch(e){ if(!silent) toast('MT5 relay unreachable'); }
}
function startMT5Poll(){ if(_mt5Poll) return; _mt5Poll=setInterval(()=>{ if(MT5_RELAY_URL) pullMT5(true); }, 45000); }
async function saveRelay(){
  MT5_RELAY_URL=val('relayUrl').trim(); MT5_RELAY_TOKEN=val('relayToken').trim();
  await sSet('tj_relayurl',MT5_RELAY_URL); await sSet('tj_relaytoken',MT5_RELAY_TOKEN);
  toast('MT5 auto-sync saved'); startMT5Poll(); pullMT5();
}

/* ============================== SETTINGS ============================== */
function vSettings(el){

  el.innerHTML=`<div class="vhead"><div><h1>Settings</h1><div class="sub">Account & instrument</div></div></div>
    ${SHOW_RELAY_UI?`<div class="panel" style="max-width:520px;margin-top:16px"><div class="panel-h"><h3>MT5 auto-sync</h3></div><div class="panel-b">
      <p class="mut" style="font-size:12.5px;line-height:1.55;margin-bottom:13px">Hands-off MT5 logging. Deploy the relay script (XAUJournalRelay.gs) to your Google account, then paste its Web app URL + your secret token here and in the EA. Trades and screenshots then flow in automatically — no file uploads.</p>
      <div class="field"><label>Relay web app URL</label><input class="inp mono" id="relayUrl" value="${esc(MT5_RELAY_URL||'')}" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="field"><label>Secret token</label><input class="inp mono" id="relayToken" value="${esc(MT5_RELAY_TOKEN||'')}" placeholder="must match the EA + relay"></div>
      <div style="display:flex;gap:8px"><button class="btn gold" onclick="saveRelay()">Save</button><button class="btn ghost" onclick="pullMT5()">Pull now</button></div>
    </div></div>`:''}

    ${DRIVE_ON?`<div class="panel" style="max-width:520px;margin-top:16px"><div class="panel-h"><h3>Google Drive sync</h3></div><div class="panel-b">
      <p class="mut" style="font-size:12.5px;line-height:1.55;margin-bottom:13px">Your journal and screenshots are saved privately to your own Google Drive (a hidden app folder). It loads and saves automatically — no manual syncing.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="driveSelfTest()">Run diagnostics</button><button class="btn ghost" onclick="driveSignOut()">Sign out of Google Drive</button></div>
    </div></div>`:''}
    ${hasPersist?'':'<div class="notice">⚠ This browser is blocking local storage, so data won\'t survive a refresh. Try a normal browser window (not private/incognito), or export a backup regularly.</div>'}
    <div class="panel" style="max-width:520px"><div class="panel-h"><h3>Prop firm / account</h3></div><div class="panel-b">
      <div class="field"><label>Prop firm / broker name</label><input class="inp" id="set_firm" value="${esc(S.propFirm||'')}" placeholder="e.g. FTMO, MyForexFunds, personal"></div>
      <div class="row2">
        <div class="field"><label>Account size</label><input class="inp mono" type="number" id="set_size" value="${S.accountSize||''}" placeholder="100000"></div>
        <div class="field"><label>Starting balance</label><input class="inp mono" type="number" id="set_start" value="${S.startBal||''}" placeholder="100000"></div>
      </div>
      <div class="field"><label>Contract size <span class="mut" style="text-transform:none;font-weight:400">(oz per lot — standard XAUUSD = 100)</span></label><input class="inp mono" type="number" id="set_contract" value="${S.contract||100}"></div>
      <div class="field" style="margin-bottom:0"><label>Current equity</label><div class="mono ${cls(eq-(S.startBal||0))}" style="font-size:20px;font-weight:600">${fmt$(eq)}</div></div>
    </div><div class="modal-f" style="border-top:none;padding-top:0"><button class="btn gold" onclick="saveSettings()">Save settings</button></div></div>

    <div class="panel" style="max-width:520px;margin-top:16px"><div class="panel-h"><h3>Risk &amp; goals</h3></div><div class="panel-b">
      <p class="mut" style="font-size:12.5px;margin-bottom:14px;line-height:1.5">Set limits and targets (leave blank to disable). The dashboard tracks them and warns you when you cross a line — discipline you can see.</p>
      <div class="row2">
        <div class="field"><label>Daily loss limit ($)</label><input class="inp mono" type="number" id="set_dloss" value="${S.dailyLoss||''}" placeholder="e.g. 300"></div>
        <div class="field"><label>Max trades / day</label><input class="inp mono" type="number" id="set_maxtr" value="${S.maxTrades||''}" placeholder="e.g. 5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Weekly profit target ($)</label><input class="inp mono" type="number" id="set_wtgt" value="${S.weeklyTarget||''}" placeholder="e.g. 1000"></div>
        <div class="field"><label>Monthly profit target ($)</label><input class="inp mono" type="number" id="set_mtgt" value="${S.monthlyTarget||''}" placeholder="e.g. 4000"></div>
      </div>
      <div class="field" style="margin-bottom:0"><label>Max drawdown limit ($ from peak equity)</label><input class="inp mono" type="number" id="set_dd" value="${S.ddLimit||''}" placeholder="e.g. 1000"></div>
    </div><div class="modal-f" style="border-top:none;padding-top:0"><button class="btn gold" onclick="saveRisk()">Save risk &amp; goals</button></div></div>

    <div class="panel" style="max-width:520px;margin-top:16px"><div class="panel-h"><h3>AI Analyst</h3></div><div class="panel-b">
      <p class="mut" style="font-size:12.5px;margin-bottom:14px;line-height:1.55">The AI Analyst calls Claude to review your journal. Inside claude.ai it works automatically. If you run this file on your own (downloaded), paste an Anthropic API key — it's stored only on this device and sent only to Anthropic. You can also use "Copy for Claude" on the Analyst tab with no key at all.</p>
      <div class="field" style="margin-bottom:10px"><label>Anthropic API key (optional)</label><input class="inp mono" type="password" id="set_aikey" value="${esc(AIKEY||'')}" placeholder="sk-ant-..." autocomplete="off"></div>
      <div style="display:flex;gap:10px;align-items:center"><button class="btn gold" onclick="saveAIKey()">Save key</button><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" class="gold" style="font-size:12px;font-weight:600">Get a key →</a></div>
    </div></div>

    <div class="panel" style="max-width:520px;margin-top:16px"><div class="panel-h"><h3>Data</h3></div><div class="panel-b">

      <button class="btn ghost" onclick="openImport()">Sync from MT5</button>
      <button class="btn ghost" style="margin-left:8px" onclick="exportData()">Export JSON backup</button>

async function saveSettings(){
  S.propFirm=val('set_firm').trim();
  S.accountSize=+val('set_size')||0;
  S.startBal=+val('set_start')||0;
  S.contract=+val('set_contract')||100;
  await sSet('tj_settings',S);
  // recompute pnl/r with new contract
  TRADES.forEach(t=>{ const c=calc(t); t.pnl=c.pnl; t.r=c.r; t.risk=c.risk; });
  await sSet('tj_trades',TRADES);
  refreshBal(); toast('Settings saved'); go('settings');
}
async function saveRisk(){
  S.dailyLoss=+val('set_dloss')||0;
  S.maxTrades=+val('set_maxtr')||0;
  S.weeklyTarget=+val('set_wtgt')||0;
  S.monthlyTarget=+val('set_mtgt')||0;
  S.ddLimit=+val('set_dd')||0;
  await sSet('tj_settings',S);
  toast('Risk & goals saved'); go('settings');
}
function riskStatus(){
  const today=new Date().toISOString().slice(0,10);
  const dm=dailyMap(TRADES); const todayP=dm[today]||0;
  const todayN=TRADES.filter(t=>t.date===today).length;
  const now=new Date();
  const ws=new Date(now); const day=(ws.getDay()+6)%7; ws.setDate(ws.getDate()-day); ws.setHours(0,0,0,0);
  const ms=new Date(now.getFullYear(),now.getMonth(),1);
  const weekP=TRADES.filter(t=>new Date(t.date+'T00:00:00')>=ws).reduce((s,t)=>s+(+t.pnl||0),0);
  const monthP=TRADES.filter(t=>new Date(t.date+'T00:00:00')>=ms).reduce((s,t)=>s+(+t.pnl||0),0);
  let eq=(S.startBal||0),peak=eq; sorted().forEach(t=>{ eq+=(+t.pnl||0); peak=Math.max(peak,eq); });
  const curDD=Math.max(0,peak-eq);
  return {todayP,todayN,weekP,monthP,curDD};
}
function riskWarnings(){
  const r=riskStatus(),w=[];
  if(S.dailyLoss && r.todayP <= -Math.abs(S.dailyLoss)) w.push(`Daily loss limit hit (${dollars(r.todayP)}). Consider stopping for today.`);
  if(S.maxTrades && r.todayN >= S.maxTrades) w.push(`Max trades reached today (${r.todayN}/${S.maxTrades}).`);
  if(S.ddLimit && r.curDD >= Math.abs(S.ddLimit)) w.push(`Drawdown limit breached (${fmt$(r.curDD)} from peak).`);
  return w;
}
function riskConfigured(){ return !!(S.dailyLoss||S.maxTrades||S.weeklyTarget||S.monthlyTarget||S.ddLimit); }
function riskRow(label, txt, val, max, col){
  const pct = max>0 ? Math.min(100, Math.max(0, Math.abs(val)/max*100)) : 0;
  return `<div class="risk-row"><div class="risk-h"><span>${label}</span><span class="mono">${txt}</span></div>
    <div class="risk-bar"><div class="risk-fill" style="width:${pct.toFixed(0)}%;background:${col}"></div></div></div>`;
}
function riskCard(){
  if(!riskConfigured()) return '';
  const r=riskStatus(); let rows='';
  if(S.dailyLoss) rows+=riskRow('Daily loss', `${dollars(Math.min(0,r.todayP))} / -${fmt$(S.dailyLoss)}`, Math.min(0,r.todayP), S.dailyLoss, 'var(--down)');
  if(S.maxTrades) rows+=riskRow('Trades today', `${r.todayN} / ${S.maxTrades}`, r.todayN, S.maxTrades, 'var(--gold)');
  if(S.ddLimit) rows+=riskRow('Drawdown', `${fmt$(r.curDD)} / ${fmt$(S.ddLimit)}`, r.curDD, S.ddLimit, 'var(--down)');
  if(S.weeklyTarget) rows+=riskRow('Weekly target', `${dollars(r.weekP)} / ${fmt$(S.weeklyTarget)}`, Math.max(0,r.weekP), S.weeklyTarget, 'var(--up)');
  if(S.monthlyTarget) rows+=riskRow('Monthly target', `${dollars(r.monthP)} / ${fmt$(S.monthlyTarget)}`, Math.max(0,r.monthP), S.monthlyTarget, 'var(--up)');
  return `<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Risk &amp; goals</h3><a href="#settings" class="mut" style="font-size:12px">Edit →</a></div><div class="panel-b">${rows}</div></div>`;
}
async function saveAIKey(){
  AIKEY=val('set_aikey').trim();
  await sSet('tj_aikey',AIKEY);
  toast(AIKEY?'API key saved on this device':'API key cleared');
}
function exportData(){
  const blob=new Blob([JSON.stringify({settings:S,setups:SETUPS,trades:TRADES},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download='xau-journal-backup.json'; a.click(); URL.revokeObjectURL(u);
  toast('Backup downloaded');
}
async function wipeAll(){
  const body=`<p style="font-size:14px;color:var(--ink)">This permanently deletes all ${TRADES.length} trades, ${SETUPS.length} setups, screenshots and settings. This can't be undone.</p>`;
  openModal('Reset everything?',body,[
    `<button class="btn ghost" onclick="closeModal('detailScrim')">Cancel</button>`,
    `<button class="btn danger" onclick="confirmWipe()">${sI(I.trash)}Delete all</button>`
  ],'','detailScrim');
}
async function confirmWipe(){
  for(const t of TRADES){ await sDel('tj_shots_'+t.id); }
  TRADES=[]; SETUPS=[]; S={propFirm:'',accountSize:0,startBal:0,contract:100};
  await sSet('tj_trades',[]); await sSet('tj_setups',[]); await sSet('tj_settings',S);
  closeModal('detailScrim'); refreshBal(); go('dashboard'); toast('Everything reset');
}

/* ============================== MODALS / TOAST ============================== */
function openModal(title,body,footer,extraClass,scrimId){
  scrimId=scrimId||'scrim';
  let sc=document.getElementById(scrimId);
  if(!sc){ sc=document.createElement('div'); sc.className='scrim'; sc.id=scrimId; document.body.appendChild(sc); }
  sc.innerHTML=`<div class="modal ${extraClass||''}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="closeModal('${scrimId}')">${sI('<path d="M18 6 6 18M6 6l12 12"/>')}</button></div>
    <div class="modal-b">${body}</div>
    ${footer&&footer.length?`<div class="modal-f">${footer.join('')}</div>`:''}</div>`;
  sc.classList.add('on');
  sc.onclick=e=>{ if(e.target===sc) closeModal(scrimId); };
}
function closeModal(id){ const sc=document.getElementById(id); if(sc) sc.classList.remove('on'); }

let toastTimer;
function toast(msg,btnTxt,btnFn){
  const t=document.getElementById('toast'),b=document.getElementById('toastBtn');
  document.getElementById('toastMsg').textContent=msg;
  if(btnTxt){ b.style.display=''; b.textContent=btnTxt; b.onclick=()=>{ btnFn&&btnFn(); t.classList.remove('on'); }; }
  else b.style.display='none';
  t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'), btnTxt?5000:2600);
}

    <div class="logo"><img src="${LOGO_LOCK}" alt=""></div>

    <button class="btn gold" onclick="${fn}">${sI(I.plus)}${esc(btn)}</button>
  </div></div>`;
}

</script>
